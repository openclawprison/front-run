services:
  - type: web
    name: front-run
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: front-run-db
          property: connectionString
      - key: INGEST_SECRET
        generateValue: true
      - key: TWITTERAPI_IO_KEY
        sync: false
      - key: TWITTERAPI_MONTHLY_BUDGET_USD
        value: "5"
      - key: TWITTERAPI_SAMPLE_INTERVAL_MINUTES
        value: "30"
      - key: TWITTERAPI_QUERY_LIMIT
        value: "1"
      - key: TWITTERAPI_CACHE_HOURS
        value: "6"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_REGIONS
        value: US
      - key: BRIGHTDATA_API_TOKEN
        sync: false
      - key: TIKTOK_QUERY_LIMIT
        value: "6"
      - key: TIKTOK_POSTS_PER_QUERY
        value: "20"
      - key: TIKTOK_SEED_QUERIES
        value: viral animal usa,viral pet usa,zoo baby viral,animal rescue viral,cute animals usa,wildlife caught on camera
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna

  - type: cron
    name: front-run-ingest
    runtime: node
    plan: starter
    region: singapore
    schedule: "*/5 * * * *"
    buildCommand: npm ci
    startCommand: npm run cron:ingest
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: front-run-db
          property: connectionString
      - key: FRONT_RUN_URL
        fromService:
          type: web
          name: front-run
          envVarKey: RENDER_EXTERNAL_URL
      - key: INGEST_SECRET
        fromService:
          type: web
          name: front-run
          envVarKey: INGEST_SECRET
      - key: TWITTERAPI_IO_KEY
        fromService:
          type: web
          name: front-run
          envVarKey: TWITTERAPI_IO_KEY
      - key: TWITTERAPI_MONTHLY_BUDGET_USD
        value: "5"
      - key: TWITTERAPI_SAMPLE_INTERVAL_MINUTES
        value: "30"
      - key: TWITTERAPI_QUERY_LIMIT
        value: "1"
      - key: TWITTERAPI_CACHE_HOURS
        value: "6"
      - key: YOUTUBE_API_KEY
        fromService:
          type: web
          name: front-run
          envVarKey: YOUTUBE_API_KEY
      - key: YOUTUBE_REGIONS
        value: US
      - key: BRIGHTDATA_API_TOKEN
        fromService:
          type: web
          name: front-run
          envVarKey: BRIGHTDATA_API_TOKEN
      - key: TIKTOK_QUERY_LIMIT
        value: "6"
      - key: TIKTOK_POSTS_PER_QUERY
        value: "20"
      - key: TIKTOK_SEED_QUERIES
        value: viral animal usa,viral pet usa,zoo baby viral,animal rescue viral,cute animals usa,wildlife caught on camera
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: front-run
          envVarKey: OPENAI_API_KEY
      - key: OPENAI_MODEL
        value: gpt-5.6-luna

databases:
  - name: front-run-db
    plan: free
    region: singapore
    databaseName: front_run
    user: front_run
    ipAllowList: []
